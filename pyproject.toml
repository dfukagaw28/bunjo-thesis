[project]
name = "bunjo-thesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Quarto がコードを実行するのに使う
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyyaml>=6.0.3",
    # 分析と図表
    "matplotlib>=3.11.2",
    "matplotlib-fontja>=1.1.0",
    "pandas>=3.0.6",
    "tabulate>=0.10.0",
]

# 手元で試しながら分析するためのもの(JupyterLab など)。
# uv sync では入るが、Docker のイメージと GitHub Actions では入れない(--no-dev)
[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
