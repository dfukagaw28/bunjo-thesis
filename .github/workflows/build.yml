name: PDF を作る

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # apt の TeX Live より速い TinyTeX を使う。足りないパッケージは quarto render が自動で入れる
      - name: LaTeX(TinyTeX)を入れる
        run: |
          curl -fsSL https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/TinyTeX-1-linux-x86_64-v2026.10.tar.xz | tar xJ -C "$HOME"
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          tlmgr update --self
          tlmgr install jlreq luatexja haranoaji selnolig caption

      # uv.lock に記録した版のパッケージを入れる(Python の版は .python-version)
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked

      - uses: quarto-dev/quarto-actions/setup@v2

      - run: uv run quarto render

      - uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: _book/thesis.pdf
